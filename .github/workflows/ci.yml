name: ci

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
    paths-ignore:
      - docs/**
      - '**/*.md'
      - newsfragments/**
      - LICENSE
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - newsfragments/**
      - LICENSE
  workflow_dispatch:

jobs:
  stub-and-lint:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      - name: Stub + cmocka suites
        run: pixi run test-stub

  sanitize:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      - name: Stub suite under ASan/UBSan
        run: pixi run test-stub-sanitize

  embed:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      - name: Resolve LAMMPS tag
        run: |
          tag="$(bash scripts/build_lammps.sh --print-tag)"
          if [ -z "${tag}" ]; then
            echo "scripts/build_lammps.sh did not report a LAMMPS tag" >&2
            exit 1
          fi
          echo "LAMMPS_TAG=${tag}" >> "${GITHUB_ENV}"
      - name: Cache liblammps
        uses: actions/cache@v4
        with:
          path: .lammps-install
          key: liblammps-${{ env.LAMMPS_TAG }}-serial-v1
      - name: Build liblammps (on cache miss)
        env:
          LAMMPS_TAG: ${{ env.LAMMPS_TAG }}
        run: pixi run -e embed build-lammps
      - name: Embed suite (real liblammps, LJ analytic E2E)
        run: pixi run -e embed test-embed

  tsan:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: latest
          cache: true
      - name: Resolve LAMMPS tag
        run: |
          tag="$(bash scripts/build_lammps.sh --print-tag)"
          if [ -z "${tag}" ]; then
            echo "scripts/build_lammps.sh did not report a LAMMPS tag" >&2
            exit 1
          fi
          echo "LAMMPS_TAG=${tag}" >> "${GITHUB_ENV}"
      - name: Cache liblammps
        uses: actions/cache@v4
        with:
          path: .lammps-install
          key: liblammps-${{ env.LAMMPS_TAG }}-serial-v1
      - name: Build liblammps (on cache miss)
        env:
          LAMMPS_TAG: ${{ env.LAMMPS_TAG }}
        run: pixi run -e embed build-lammps
      - name: Concurrent sessions under ThreadSanitizer
        run: pixi run -e embed test-embed-tsan

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 
    'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}
